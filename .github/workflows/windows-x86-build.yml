name: Windows x86 Build
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      actions: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      # MSYS2 is phasing out MINGW32 and keeps removing packages from it
      # (mingw-w64-i686-gdb went in October 2026). If something this build
      # needs disappears, we may have to pin MINGW32 to a specific MSYS2
      # snapshot. The x86 build would then stop getting toolchain and library
      # updates and drift away from the x64 build.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          suppress-deprecation-warnings: msystem-mingw32
          update: true
          install: >-
            git
            mingw-w64-i686-cmake mingw-w64-i686-gcc mingw-w64-i686-ninja mingw-w64-i686-pkgconf
            mingw-w64-i686-fluidsynth
            mingw-w64-i686-flac mingw-w64-i686-freetype mingw-w64-i686-libogg mingw-w64-i686-libvorbis mingw-w64-i686-libwebp mingw-w64-i686-opusfile

      # MSYS2 no longer has 32-bit allegro, enet and libmad: build the
      # latest release of each, cached until a new release or a change to
      # the script.
      - name: Dependency Versions
        run: echo "DEPS_VERSIONS=$(./scripts/build-windows-x86-deps.sh versions)" >> "$GITHUB_ENV"

      - name: Cache Dependencies
        uses: actions/cache@v4
        with:
          path: deps-x86
          key: windows-x86-deps-${{ env.DEPS_VERSIONS }}-${{ hashFiles('scripts/build-windows-x86-deps.sh') }}

      - name: Build Dependencies
        run: ./scripts/build-windows-x86-deps.sh deps-x86

      - name: Build
        run: ./scripts/build-windows-x86.sh

      # The x86 build is for 32-bit Windows, mostly Windows 7.
      - name: Check Windows 7 compatibility
        run: ./scripts/check-windows7-imports.sh dist

      - name: Artifact Name
        # Branch names and pull request refs ("46/merge") may contain "/",
        # which is not allowed in artifact names.
        shell: bash
        run: echo "ARTIFACT_REF=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Delete Old Artifacts
        # The token for pull requests from forks is read-only and cannot
        # delete artifacts; their artifacts expire instead.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        id: artifact
        with:
          script: |
            const res = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
            })

            res.data.artifacts
                .filter(({ name }) => name === 'dunedynasty-${{ env.ARTIFACT_REF }}-windows-x86')
                .forEach(({ id }) => {
                  github.rest.actions.deleteArtifact({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      artifact_id: id,
                  })
                })
                
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dunedynasty-${{ env.ARTIFACT_REF }}-windows-x86
          path: dist
